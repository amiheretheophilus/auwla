<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conduit</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --green: #5cb85c; --ink: #373a3c; --muted: #999; --line: #e5e5e5; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Source Sans Pro', system-ui, sans-serif; color: var(--ink); }
      a { color: var(--green); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button, .button { font: inherit; cursor: pointer; border-radius: 4px; border: 1px solid var(--green);
        background: #fff; color: var(--green); padding: 0.3rem 0.8rem; font-size: 0.9rem; }
      button:hover:not(:disabled), .button:hover { background: var(--green); color: #fff; text-decoration: none; }
      button:disabled { opacity: 0.55; cursor: default; }
      button.danger { border-color: #b85c5c; color: #b85c5c; }
      button.danger:hover:not(:disabled) { background: #b85c5c; color: #fff; }
      button.link { border: 0; padding: 0; color: var(--muted); font-size: 0.8rem; }
      input, textarea { font: inherit; width: 100%; padding: 0.7rem 1rem; margin-bottom: 0.8rem;
        border: 1px solid rgba(0,0,0,.15); border-radius: 4px; }
      .app { min-height: 100vh; display: flex; flex-direction: column; }
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 8vw; }
      .navbar nav { display: flex; gap: 1.2rem; align-items: center; }
      .navbar nav a { color: rgba(0,0,0,.4); }
      .navbar nav a.active, .navbar nav a:hover { color: rgba(0,0,0,.8); text-decoration: none; }
      .brand { font-family: 'Titillium Web', system-ui, sans-serif; font-weight: 700; font-size: 1.5rem; }
      .me { display: inline-flex; gap: 0.4rem; align-items: center; }
      .avatar { border-radius: 50%; background: #eee; vertical-align: middle; }
      .banner { background: var(--green); color: #fff; text-align: center; padding: 2rem 8vw;
        box-shadow: inset 0 8px 8px -8px rgba(0,0,0,.3), inset 0 -8px 8px -8px rgba(0,0,0,.3); }
      .banner h1 { font-family: 'Titillium Web', system-ui, sans-serif; font-size: 3rem; margin: 0 0 0.3rem; }
      .banner.dark { background: #333; text-align: left; }
      .banner.dark h1 { font-size: 2.4rem; }
      .banner.user { background: #f3f3f3; color: var(--ink); }
      .banner.user h1 { font-size: 1.6rem; }
      .columns { display: grid; grid-template-columns: 3fr 1fr; gap: 2rem; padding: 1.5rem 8vw; }
      @media (max-width: 720px) { .columns { grid-template-columns: 1fr; } }
      .tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--line); margin-bottom: 0.5rem; align-items: center; }
      .tabs button, .tabs a { border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted);
        padding: 0.5rem 1rem; background: none; }
      .tabs .active { color: var(--green); border-bottom-color: var(--green); }
      .tabs button:hover:not(:disabled) { background: none; color: var(--ink); }
      .updating { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
      .preview { border-top: 1px solid var(--line); padding: 1.4rem 0; }
      .preview header { display: flex; justify-content: space-between; align-items: center; }
      .preview-link { color: inherit; display: block; margin-top: 0.8rem; }
      .preview-link:hover { text-decoration: none; }
      .preview-link h2 { margin: 0 0 0.2rem; font-size: 1.4rem; }
      .preview-link p { color: var(--muted); margin: 0 0 1rem; }
      .preview-link span { color: var(--muted); font-size: 0.8rem; }
      .author-line { display: flex; gap: 0.5rem; align-items: center; }
      .author-line div { display: flex; flex-direction: column; line-height: 1.1; }
      .author { font-weight: 500; }
      .banner.dark .author { color: #fff; }
      .date { color: #bbb; font-size: 0.8rem; }
      .favorite.on { background: var(--green); color: #fff; }
      .tag-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.3rem; float: right; margin: 0; }
      .tag-list li { border: 1px solid #ddd; color: #aaa; border-radius: 999px; padding: 0 0.6rem; font-size: 0.8rem; }
      .tag-list.editable { float: none; margin-bottom: 1rem; }
      .tag-list.editable button { border: 0; padding: 0; color: #aaa; }
      .sidebar { background: #f3f3f3; padding: 0.6rem 1rem 1rem; border-radius: 4px; align-self: start; }
      .tag-cloud { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .tag { background: #818a91; color: #fff; border: 0; border-radius: 999px; font-size: 0.8rem; padding: 0.1rem 0.6rem; }
      .pager { display: flex; gap: 0.2rem; margin-top: 1rem; }
      .pager .current { background: var(--green); color: #fff; }
      .article-page .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .article-body { padding: 2rem 8vw; font-size: 1.15rem; line-height: 1.7; overflow: hidden; }
      .comments { max-width: 640px; margin: 0 auto 3rem; padding: 0 1rem; width: 100%; }
      .comment { border: 1px solid var(--line); border-radius: 4px; margin-top: 0.8rem; }
      .comment p { padding: 1rem; margin: 0; }
      .comment footer { background: #f5f5f5; padding: 0.5rem 1rem; display: flex; gap: 0.5rem; align-items: center; font-size: 0.85rem; }
      .comment.removing { opacity: 0.4; }
      .comment-form { display: flex; flex-direction: column; align-items: flex-end; }
      .auth, .settings, .editor { max-width: 540px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
      .auth h1, .settings h1 { text-align: center; }
      .auth > a { display: block; text-align: center; margin-bottom: 1rem; }
      .editor { max-width: 760px; }
      .body-tabs { display: flex; gap: 0.3rem; margin-bottom: 0.4rem; }
      .body-tabs .active { background: var(--green); color: #fff; }
      .error-messages, .error { color: #b85c5c; }
      .muted { color: var(--muted); }
      .saved { color: var(--green); margin-left: 0.6rem; }
      .missing { text-align: center; padding: 4rem 1rem; }
      footer:last-child { margin-top: auto; background: #f3f3f3; padding: 1rem 8vw; color: #bbb; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
