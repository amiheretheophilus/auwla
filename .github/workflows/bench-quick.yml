# A quick DOM timing on a GitHub runner, steadier than a desktop and much
# cheaper than `bench.yml`: old and next side by side, chosen scenarios only.
#
#   gh workflow run bench-quick.yml --ref compiler-rewrite -f scenarios=10k
#   gh workflow run bench-quick.yml --ref compiler-rewrite \
#     -f profile="module-component:select 10k;module-inline:update 10k"
#
# The tables (and profiles) are in the run summary. Use it to check a change;
# report numbers from `bench:vm`.
name: bench-quick

on:
  push:
    branches: [compiler-rewrite]
    paths: [.github/workflows/bench-quick.yml]
  workflow_dispatch:
    inputs:
      scenarios:
        description: all, 1k, 10k, or comma-separated names ("update 10k,select 10k")
        type: string
        default: 10k
      samples:
        description: Samples per cell (median reported)
        type: string
        default: '5'
      adapters:
        description: Comma-separated adapter ids; empty for all
        type: string
        default: ''
      compilers:
        description: Compilers to compare
        type: string
        default: old,next
      profile:
        description: Optional CPU profiles of next, "adapter:scenario;adapter:scenario"
        type: string
        default: ''
      octane:
        description: Also run Octane --quick for memoized-dom only, old (HEAD) against next
        type: boolean
        default: false
      runtime_ref:
        description: Optional baseline commit for a same-compiler ABBA runtime comparison
        type: string
        default: ''
      runtime_operations:
        description: Operations in snapshot comparisons, e.g. create,update,clear
        type: string
        default: create,clear
      compiler_ref:
        description: Optional compiler-next baseline with its matching runtime, in ABBA order
        type: string
        default: ''

concurrency:
  group: bench-quick-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: quick DOM timing (${{ inputs.scenarios || '10k' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          # The optional comparison archives the requested runtime from history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      # The old compiler and the runtime load from their built packages.
      - run: bun run build
      - name: Time old and next
        env:
          SCENARIOS: ${{ inputs.scenarios || '10k' }}
          SAMPLES: ${{ inputs.samples || '5' }}
          ADAPTERS: ${{ inputs.adapters }}
          COMPILERS: ${{ inputs.compilers || 'old,next' }}
        run: |
          args=(--compilers="$COMPILERS" --samples="$SAMPLES" --scenarios="$SCENARIOS" --out=quick.md)
          if [ -n "$ADAPTERS" ]; then args+=(--adapters="$ADAPTERS"); fi
          bun run bench/dom/quick.ts "${args[@]}"
          { echo "## Quick DOM timing at ${GITHUB_SHA::8}"; cat quick.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Profile
        if: inputs.profile != ''
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          IFS=';' read -ra targets <<< "$PROFILE"
          for target in "${targets[@]}"; do
            adapter="${target%%:*}"; scenario="${target#*:}"
            {
              echo "## Profile: $adapter, $scenario"
              echo '```'
              bun run bench/dom/profile.ts --adapter="$adapter" --scenario="$scenario" --runs=3 --top=30
              echo '```'
            } >> profiles.md
          done
          cat profiles.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare runtimes with the same compiler
        if: inputs.runtime_ref != ''
        env:
          BENCH_COMPILER: next
          BEFORE_REF: ${{ inputs.runtime_ref }}
          SAMPLES: ${{ inputs.samples || '5' }}
          OPERATIONS: ${{ inputs.runtime_operations || 'create,clear' }}
        run: |
          bun run bench/dom/compare.ts --before-ref="$BEFORE_REF" --isolate=runtime --operations="$OPERATIONS" --samples="$SAMPLES"
          cp bench/dom/dist/compare/*-runtime/results.md runtime-comparison.md
          cat runtime-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare compiler-next snapshots with their matching runtimes
        if: inputs.compiler_ref != ''
        env:
          BENCH_COMPILER: next
          BEFORE_REF: ${{ inputs.compiler_ref }}
          SAMPLES: ${{ inputs.samples || '5' }}
          OPERATIONS: ${{ inputs.runtime_operations || 'create,clear' }}
        run: |
          bun run bench/dom/compare.ts --before-ref="$BEFORE_REF" --before-compiler=next --isolate=both --operations="$OPERATIONS" --samples="$SAMPLES"
          cp bench/dom/dist/compare/*-both-next/results.md compiler-comparison.md
          cat compiler-comparison.md >> "$GITHUB_STEP_SUMMARY"
      # Octane's upstream harness needs Node >= 24.11.
      - if: inputs.octane
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Octane (memoized-dom only, quick)
        if: inputs.octane
        env:
          BENCH_COMPILER: next
        run: |
          bun run bench/octane/setup.ts
          bun run bench/octane/run.ts --quick --targets=memoized-dom --before-ref=HEAD
          latest="$(ls -d bench/octane/results/*/ | sort | tail -1)"
          cp "$latest/results.md" octane.md
          { echo "## Octane quick at ${GITHUB_SHA::8}"; cat octane.md; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-quick
          path: |
            quick.md
            profiles.md
            octane.md
            runtime-comparison.md
            compiler-comparison.md
            bench/dom/dist/compare/*-runtime/results.json
            bench/dom/dist/compare/*-both-next/results.json
            bench/dom/dist/quick-*.js
          retention-days: 7
