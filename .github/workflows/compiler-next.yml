# The slow compiler-next checks, run by hand when a batch is too slow for the
# development machine (wiki/compiler/testing.md, "Where tests run"). Local runs
# come first; this workflow never runs on push.
#
#   gh workflow run compiler-next.yml --ref compiler-rewrite -f suite=cases
#   gh run watch <id> --repo amiheretheophilus/auwla --exit-status
name: compiler-next

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which slow batch to run
        type: choice
        default: all
        options: [all, cases, reference, generators, unit]

concurrency:
  group: compiler-next-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: types, unit and runtime tests
    if: inputs.suite == 'all' || inputs.suite == 'unit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun check
        working-directory: packages/compiler-next
      - run: bun test src
        working-directory: packages/compiler-next
      - run: bun test ./packages/runtime/tests

  reference:
    name: every case on the reference
    if: inputs.suite == 'all' || inputs.suite == 'reference'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: REFERENCE_ONLY=1 bun test tests/cases
        working-directory: packages/compiler-next

  cases:
    name: every case on compiler-next (failures must name their phase)
    if: inputs.suite == 'all' || inputs.suite == 'cases'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Cases for later phases fail by design; the gate fails the job only
      # when a failure does not name the phase that builds it.
      - run: COMPILER=next bun test tests/cases > cases.log 2>&1 || true
        working-directory: packages/compiler-next
      - run: bun scripts/phase-gate.ts cases.log
        working-directory: packages/compiler-next
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cases-log
          path: packages/compiler-next/cases.log
          retention-days: 3
      # What compiler-next emitted for every case (`next/`, or `next/ERROR.txt`
      # when it did not compile) beside the reference's output (`reference/`):
      #   gh run download <id> --repo amiheretheophilus/auwla -n cases-output -D packages/compiler-next/tests/out
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cases-output
          path: packages/compiler-next/tests/out
          retention-days: 3

  generators:
    name: generators at 200 programs
    if: inputs.suite == 'all' || inputs.suite == 'generators'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: COMPILER=next FC_RUNS=200 bun test tests/generator
        working-directory: packages/compiler-next
