# The benchmarks (`bench/README.md`), run by hand on a GitHub runner:
#
#   gh workflow run bench.yml --ref compiler-rewrite -f mode=full
#   gh run download <id> --repo amiheretheophilus/auwla -n bench-results
#
# A shared runner is noisier than the benchmark VM. Compare columns within one
# run (memoized-dom against vanilla JS, Octane's frameworks, or `before_ref`
# side by side), not numbers across runs.
name: bench

on:
  # GitHub registers a workflow only after an event runs it. A push that
  # changes this file runs it with the defaults below (full, all, next).
  push:
    branches: [compiler-rewrite]
    paths: [.github/workflows/bench.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: quick (correctness gates, one Octane sample) or full (timed)
        type: choice
        default: full
        options: [full, quick]
      only:
        description: Which suites to run
        type: choice
        default: all
        options: [all, dom, octane]
      compiler:
        description: Which compiler builds memoized-dom
        type: choice
        default: next
        options: [next, old]
      before_ref:
        description: Optional baseline commit timed side by side (e.g. d6e678b)
        type: string
        default: ''

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench:vm (${{ inputs.mode || 'full' }}, ${{ inputs.only || 'all' }}, ${{ inputs.compiler || 'next' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          # --before-ref archives the baseline commit from history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      # Octane's upstream harness needs Node >= 24.11.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: bun run bench:vm
        env:
          # The DOM suite drives the runner's installed Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          # A push has no inputs; use the defaults.
          MODE: ${{ inputs.mode || 'full' }}
          ONLY: ${{ inputs.only || 'all' }}
          COMPILER: ${{ inputs.compiler || 'next' }}
          BEFORE_REF: ${{ inputs.before_ref }}
        run: |
          args=(--compiler="$COMPILER")
          if [ "$MODE" = quick ]; then args+=(--quick); fi
          if [ "$ONLY" != all ]; then args+=(--only="$ONLY"); fi
          if [ -n "$BEFORE_REF" ]; then args+=(--before-ref="$BEFORE_REF"); fi
          bun run bench:vm "${args[@]}"
      - if: always()
        name: Summary
        run: cat bench/results/*/README.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: bench/results
          retention-days: 14
